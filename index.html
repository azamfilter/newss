
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AzamFilter | Paste Listing</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 180px;
      padding: 10px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
    table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px 12px;
      border: 1px solid #ccc;
    }
    th {
      cursor: pointer;
      background-color: #eee;
    }
  </style>
</head>
<body>
  <h1>AzamFilter | Paste Listing</h1>

  <textarea id="listingInput" placeholder="Paste listing from WhatsApp here..."></textarea>
  <br>
  <button onclick="parseListing()">Tambah Listing</button>

  <table id="listingTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">Tajuk</th>
        <th onclick="sortTable(1)">Harga</th>
        <th onclick="sortTable(2)">Jenis</th>
        <th onclick="sortTable(3)">Bilik</th>
        <th onclick="sortTable(4)">Pegangan</th>
        <th onclick="sortTable(5)">Lokasi</th>
        <th>Contact</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>

  <script>
    const table = document.getElementById("tableBody");

    function parseListing() {
      const raw = document.getElementById("listingInput").value;
      const tajuk = (raw.match(/^[^\n]+/) || [""])[0];
      const harga = (raw.match(/HARGA JUALAN\s*[:\-]?\s*RM ?([\d,]+)/i) || ["", ""])[1];
      const jenis = (raw.match(/(SEMI D|TERES.*?|BANGLO|APARTMENT|FLAT|KONDOMINIUM)/i) || ["", ""])[1].toUpperCase();
      const bilik = (raw.match(/Bilik.*?[:\-]?\s*(\d+)/i) || ["", ""])[1];
      const pegangan = (raw.match(/Freehold|Leasehold/i) || [""])[0];
      const lokasi = (raw.match(/TAMAN .*?,\s*(.*?)\n/i) || ["", ""])[1];
      const contact = (raw.match(/https?:\/\/[^\s]+/) || [""])[0];

      const row = table.insertRow();
      row.insertCell().innerText = tajuk;
      row.insertCell().innerText = harga ? `RM${harga}` : "";
      row.insertCell().innerText = jenis;
      row.insertCell().innerText = bilik;
      row.insertCell().innerText = pegangan;
      row.insertCell().innerText = lokasi;
      row.insertCell().innerHTML = contact ? `<a href="${contact}" target="_blank">Link</a>` : "-";
    }

    function sortTable(colIndex) {
      const rows = Array.from(table.rows);
      const sorted = rows.sort((a, b) => {
        const valA = a.cells[colIndex].innerText.toUpperCase();
        const valB = b.cells[colIndex].innerText.toUpperCase();
        if (!isNaN(valA) && !isNaN(valB)) return parseFloat(valA) - parseFloat(valB);
        return valA.localeCompare(valB);
      });
      table.innerHTML = "";
      sorted.forEach(row => table.appendChild(row));
    }
  </script>
</body>
</html>
